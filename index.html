<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the near-black ground reach the edges of a notched
     screen; css/styles.css pays for it with env(safe-area-inset-*) padding on
     the header, the shell, the overlays and the two pinned stacks. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110f">
<meta name="description" content="Атлас окружений, путешествий и опасностей. Daggerheart™ Compatible.">
<!-- Public but unlisted: this site is reachable by direct link only. See the
     "Unlisted public deployment" section in README.md — this tag is not
     access control, just a request that compliant crawlers not index it. -->
<meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">
<!-- Filled in dist/index.html only, by scripts/version-assets.js, with a
     content hash of the production css/js (ui) and data/*.json (data)
     files. Always empty in source — see "Automatic asset versioning" in
     CLAUDE.md. -->
<meta name="atlas-ui-version" content="">
<meta name="atlas-data-version" content="">
<title>Атлас Бахуса — окружения, путешествия и опасности</title>
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<!-- The font request lives here rather than as an @import inside styles.css:
     an @import cannot start until that file has been fetched and parsed, which
     puts a whole round trip in front of the first text paint. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&family=Architects+Daughter&display=swap">
<link rel="stylesheet" href="css/styles.css" data-cache-version="ui">
<link rel="stylesheet" href="css/journey2.css" data-cache-version="ui">
<!-- Picks which static loading skeleton shows before js/app.js runs: the
     route is only known from the hash, so this runs synchronously, pre-paint.
     It only sets a data attribute; routing itself stays in js/route-utils.js. -->
<script>if(/^#\/journey2?(?:[\/?]|$)/.test(location.hash))document.documentElement.dataset.bootRoute='journey2';</script>
</head>
<body>
  <!-- Static fallback shown before js/app.js runs. renderHeader() overwrites
       this on first render. #prep-chrome is display:contents on
       every other route (a no-op wrapper) and only becomes a manually
       toggled expanded/compact toolbar on #/prep — see the "Prep
       Prep chrome" rules in css/styles.css and initPrepChrome() in
       js/app.js. -->
  <div id="prep-chrome">
    <header class="site-header" id="header">
      <h1>Атлас Бахуса</h1>
      <p>Окружения, путешествия и опасности · Daggerheart™ Compatible</p>
    </header>
  </div>
  <main class="shell" id="main" tabindex="-1" aria-busy="true">
    <!-- No environment data below — see "Initial loading shell" in CLAUDE.md.
         js/app.js localizes the status text and clears aria-busy once, but
         never recreates this markup. -->
    <noscript>
      <style>#toolbar,#result-count,#grid-wrap{display:none}</style>
      <div class="empty-state">
        <p>Для загрузки атласа необходимо включить JavaScript. / JavaScript is required to load the atlas.</p>
      </div>
    </noscript>
    <div class="catalog-bar-wrap"><div class="catalog-bar">
      <div id="toolbar" aria-busy="true">
        <div class="skeleton-toolbar initial-loading-shell" data-initial-loading="toolbar" aria-hidden="true">
          <div class="sk sk-field wide"></div>
          <div class="sk sk-field"></div>
          <div class="sk sk-field"></div>
          <div class="sk sk-field"></div>
        </div>
      </div>
      <div class="result-count" id="result-count" role="status" aria-live="polite">
        <span class="sr-only">Загрузка… / Loading…</span>
      </div>
    </div></div>
    <!-- The catalog is rendered client-side only, after js/app.js fetches
         data/environments.json. Until then this holds only generic
         skeleton cards, never real environment data. -->
    <div class="grid is-loading" id="grid-wrap" data-initial-loading="grid" aria-busy="true">
      <div class="sk sk-card" aria-hidden="true"></div>
      <div class="sk sk-card" aria-hidden="true"></div>
      <div class="sk sk-card" aria-hidden="true"></div>
      <div class="sk sk-card" aria-hidden="true"></div>
      <div class="sk sk-card" aria-hidden="true"></div>
      <div class="sk sk-card" aria-hidden="true"></div>
      <!-- Journey 2 only (html[data-boot-route="journey2"], see css/journey2.css):
           the map editor's own layout — toolbar strip, side panel, map — instead
           of the catalog's card grid. Hidden on every other route. -->
      <div class="sk-j2" aria-hidden="true">
        <div class="sk sk-j2-bar"></div>
        <div class="sk-j2-stage">
          <div class="sk sk-j2-map"></div>
          <div class="sk-j2-side">
            <div class="sk sk-j2-line wide"></div>
            <div class="sk sk-j2-line"></div>
            <div class="sk sk-j2-btn"></div>
            <div class="sk sk-j2-line wide"></div>
            <div class="sk sk-j2-block"></div>
          </div>
        </div>
      </div>
    </div>
    <!-- Main catalog only (never Lists/Journey/Prep): the progressive
         "Show more" status and button, filled in by renderCatalogMore() in
         js/app.js. Empty on every other route and whenever the whole result
         set already fits. -->
    <div class="catalog-more" id="catalog-more"></div>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <script src="js/safe-storage.js" data-cache-version="ui"></script>
  <script src="js/data-version.js" data-cache-version="ui"></script>
  <script src="js/route-utils.js" data-cache-version="ui"></script>
  <script src="js/list-utils.js" data-cache-version="ui"></script>
  <script src="js/search-index.js" data-cache-version="ui"></script>
  <script src="js/catalog-progressive.js" data-cache-version="ui"></script>
  <script src="js/random-environment-utils.js" data-cache-version="ui"></script>
  <script src="js/prep-utils.js" data-cache-version="ui"></script>
  <script src="js/prep-share-utils.js" data-cache-version="ui"></script>
  <script src="js/prep-reorder-utils.js" data-cache-version="ui"></script>
  <script src="js/prep-reorder-ui.js" data-cache-version="ui"></script>
  <script src="js/potential-adversary-utils.js" data-cache-version="ui"></script>
  <script src="js/freshcutgrass-utils.js" data-cache-version="ui"></script>
  <script src="js/battle-points.js" data-cache-version="ui"></script>
  <script src="js/battle-points-ui.js" data-cache-version="ui"></script>
  <script src="js/soundboard-manifest.js" data-cache-version="ui"></script>
  <script src="js/soundboard-icons.js" data-cache-version="ui"></script>
  <script src="js/soundboard-engine.js" data-cache-version="ui"></script>
  <script src="js/soundboard-ui.js" data-cache-version="ui"></script>
  <script src="js/journey2-geometry.js" data-cache-version="ui"></script>
  <script src="js/journey2-model.js" data-cache-version="ui"></script>
  <script src="js/journey2-store.js" data-cache-version="ui"></script>
  <script src="js/journey2-biome-tint.js" data-cache-version="ui"></script>
  <script src="js/journey2-projection.js" data-cache-version="ui"></script>
  <script src="js/journey2-print.js" data-cache-version="ui"></script>
  <script src="js/journey2-locate.js" data-cache-version="ui"></script>
  <script src="js/journey2-route.js" data-cache-version="ui"></script>
  <script src="js/journey2-env-deal.js" data-cache-version="ui"></script>
  <script src="js/journey2-view.js" data-cache-version="ui"></script>
  <script src="js/app.js" data-cache-version="ui"></script>
</body>
</html>
