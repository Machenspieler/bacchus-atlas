<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<!-- viewport-fit=cover lets the near-black ground reach the edges of a notched
     screen; css/styles.css pays for it with env(safe-area-inset-*) padding on
     the header, the shell, the overlays and the two pinned stacks. -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#14110f">
<meta name="description" content="Атлас окружений, путешествий и опасностей. Daggerheart™ Compatible.">
<!-- Public but unlisted: this site is reachable by direct link only. See the
     "Unlisted public deployment" section in README.md — this tag is not
     access control, just a request that compliant crawlers not index it. -->
<meta name="robots" content="noindex, nofollow, nosnippet, noimageindex">
<title>Атлас Бахуса — окружения, путешествия и опасности</title>
<link rel="icon" href="favicon.ico?v=3" sizes="any">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png?v=2">
<link rel="icon" type="image/png" sizes="512x512" href="favicon-512.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<!-- The font request lives here rather than as an @import inside styles.css:
     an @import cannot start until that file has been fetched and parsed, which
     puts a whole round trip in front of the first text paint. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="css/styles.css?v=94">
</head>
<body>
  <!-- Static fallback shown before js/app.js runs. renderHeader() overwrites
       this on first render. -->
  <header class="site-header" id="header">
    <h1>Атлас Бахуса</h1>
    <p>Полевой справочник по окружениям, путешествиям и опасностям</p>
    <p class="compat-badge">Daggerheart™ Compatible</p>
  </header>
  <main class="shell" id="main" tabindex="-1">
    <div id="toolbar"></div>
    <div class="result-count" id="result-count" role="status"></div>
    <!-- The catalog is rendered client-side only, after js/app.js fetches
         data/environments.json — nothing here until then. -->
    <div class="grid" id="grid-wrap"></div>
  </main>
  <footer class="site-footer" id="footer"></footer>
  <script src="js/app.js?v=164"></script>
</body>
</html>
