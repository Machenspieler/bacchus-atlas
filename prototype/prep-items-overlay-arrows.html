<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prep items — overlay arrows prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<!-- Reuses the production stylesheet; nothing here writes to it. Delete prototype/prep-items-overlay-arrows.* to remove. -->
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="prep-items-overlay-arrows.css">
</head>
<body>
<div class="proto-devbar">
  <strong>Mocked prototype — not production.</strong>
  <label>Arrow mode
    <select id="p-mode">
      <option value="overlay" selected>Overlay (proposed)</option>
      <option value="inflow">In-flow, hidden when no overflow (current)</option>
      <option value="reserved">Reserved gutters (old)</option>
    </select>
  </label>
  <label>View
    <select id="p-view"><option value="gallery" selected>Grid / image</option><option value="compact">List / compact</option></select>
  </label>
  <span class="proto-group" id="p-counts" role="group" aria-label="Result count"></span>
  <label>Panel width <input type="number" id="p-width" value="1280" min="600" max="2400" step="1"> px</label>
  <input type="range" id="p-width-range" min="700" max="2100" value="1280" aria-label="Panel width">
  <label><input type="checkbox" id="p-zones"> show arrow hit zones</label>
</div>

<div class="proto-stage">
  <div class="prep-wrap proto-wrap" id="p-wrap">
    <section class="prep-items-panel" aria-label="Items (mock)">
      <div class="proto-toolbar"><strong>Items</strong><span class="proto-count" id="p-count-label"></span></div>
      <div class="prep-item-strip-wrap proto-strip-wrap" id="p-strip-wrap">
        <button type="button" class="icon-btn icon-btn--circle prep-item-nav-btn proto-nav" data-nav="prev" aria-label="Scroll left">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <div class="prep-item-grid proto-grid" id="p-grid"></div>
        <button type="button" class="icon-btn icon-btn--circle prep-item-nav-btn proto-nav" data-nav="next" aria-label="Scroll right">
          <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m6 15 6-6 6 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
    </section>
  </div>

  <section class="proto-metrics" aria-label="Metrics">
    <h3>Live readout</h3>
    <table id="p-live"></table>
    <div class="proto-actions">
      <button type="button" class="btn" id="p-sweep-counts">Sweep 240→60→9→4 (all modes)</button>
      <button type="button" class="btn" id="p-sweep-widths">Find width breakpoints (700–2100)</button>
    </div>
    <pre id="p-report"></pre>
  </section>
</div>
<script src="prep-items-overlay-arrows.js"></script>
</body>
</html>
