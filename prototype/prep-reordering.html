<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Prep reordering — mocked prototype</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Forum&family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@500;700&display=swap">
<!-- Reuses the production stylesheet so the cards match the live Session Prep; nothing here writes to it. -->
<link rel="stylesheet" href="../css/styles.css">
<link rel="stylesheet" href="prep-reordering.css">
</head>
<body>
<div class="proto-devbar">
  <strong>Mocked prototype — not production.</strong>
  <label>Page width
    <select id="proto-width">
      <option value="1100">1100</option>
      <option value="1280" selected>1280</option>
      <option value="1440">1440</option>
    </select>
  </label>
  <label>Drag central cards from
    <select id="proto-mode">
      <option value="handle" selected>Handle only</option>
      <option value="card">Whole card</option>
    </select>
  </label>
  <label>Items view
    <select id="proto-items-view">
      <option value="gallery" selected>Large cards</option>
      <option value="compact">Text cards</option>
    </select>
  </label>
  <button type="button" id="proto-restore">Restore mock data</button>
</div>

<p class="proto-touch-note">Reordering is available on desktop only.</p>

<div class="prep-wrap proto-wrap" id="proto-app">
  <div class="prep-main">
    <section class="prep-col prep-col-env" aria-label="All Environments (mock)">
      <div class="prep-col-head"><h2>All Environments</h2></div>
      <div id="prep-env-list" role="list"></div>
    </section>
    <section class="prep-central" id="proto-central" aria-label="Prep (mock)"></section>
    <section class="prep-col prep-col-adv" aria-label="All Adversaries (mock)">
      <div class="prep-col-head"><h2>All Adversaries</h2></div>
      <div id="prep-adv-list" role="list"></div>
    </section>
  </div>

  <section class="prep-items-panel" aria-label="Items (mock)">
    <div class="prep-item-strip-wrap" id="proto-item-gallery"><div class="prep-item-grid" id="prep-item-grid"></div></div>
    <div class="prep-item-strip-wrap prep-item-compact-wrap" id="proto-item-compact" hidden><div class="prep-item-compact-grid" id="prep-item-compact-grid"></div></div>
  </section>

  <pre class="proto-debug" id="proto-debug" aria-label="Debug: current order"></pre>
</div>

<script src="prep-reordering-data.js"></script>
<script src="prep-reordering.js"></script>
</body>
</html>
